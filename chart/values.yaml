namespace: churchtools

service:

  name: churchtools-song-importer
  
  schedule: "0 6 * * *"
  successfulJobsHistoryLimit: "1"
  failedJobsHistoryLimit: "3"

  image:
    repository: repo
    name: churchtools/churchtools-song-importer
    version: "1.10"
    pullSecret: dockerregistry

  environment:
    # Loglevel
    LOGLEVEL: "INFO"

  volumes:
    # Config file (see config.yaml.example)
    - name: churchtools-song-importer-config
      mountPath: /usr/source/app/config.yaml
      secret: churchtools-song-importer-config
      subPath: config.yaml
    # Gesangbuch txt file
    - name: churchtools-song-importer-gesangbuch
      mountPath: /usr/source/app/files
      configMap: churchtools-song-importer-gesangbuch
      items:
      - key: gesangbuch.txt
        path: gesangbuch.txt